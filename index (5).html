<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3b48" />
  <title>Club Med Sustainability Mission</title>

  <!-- Friendly, rounded fonts. If Google Fonts is blocked, the fallbacks still work. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#102a2f;
      --muted:#60767a;
      --paper:#f8f7f2;
      --card:#ffffff;
      --line:#dce7e6;
      --nature:#0e7a66;
      --nature2:#b9e2d5;
      --community:#b76b2b;
      --community2:#f3d9bd;
      --accent:#0b5967;
      --gold:#d49a3a;
      --danger:#b54d4d;
      --shadow:0 14px 38px rgba(21,53,58,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:
        radial-gradient(circle at top left, rgba(14,122,102,.08), transparent 36%),
        radial-gradient(circle at bottom right, rgba(183,107,43,.08), transparent 34%),
        var(--paper);
      color:var(--ink);
      font-family:"Nunito","Avenir Next",system-ui,sans-serif;
      min-height:100vh;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:18px 16px 46px}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      margin-bottom:14px;
    }
    .brand{font-weight:900;letter-spacing:.01em;font-size:.95rem}
    .mini-btn{
      border:1px solid var(--line);background:#fff;color:var(--muted);
      padding:8px 12px;border-radius:999px;font-size:.82rem;font-weight:800;
    }
    .hero,.card{
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:24px;
    }
    .hero{padding:30px 24px}
    .card{padding:22px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:7px;
      text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:900;
      color:var(--accent);margin-bottom:10px;
    }
    h1,h2,h3,p{margin-top:0}
    h1,h2,h3,.story-copy,.quote{
      font-family:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    }
    h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.03;margin-bottom:14px;font-weight:700}
    h2{font-size:clamp(1.55rem,5vw,2.25rem);line-height:1.12;margin-bottom:12px;font-weight:700}
    h3{font-size:1.08rem;margin-bottom:8px;font-weight:700}
    p{line-height:1.65}
    .lead{font-size:1.05rem;color:#35545a}
    .quote{
      border-left:4px solid var(--accent);padding:12px 0 12px 16px;
      margin:18px 0;color:#26464c;font-weight:600;font-size:1.08rem;
    }
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    .btn{
      border:none;border-radius:14px;padding:13px 17px;font-weight:900;
      min-height:48px;transition:.16s ease;display:inline-flex;justify-content:center;align-items:center;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--accent);color:white}
    .btn-secondary{background:#edf5f5;color:var(--accent)}
    .btn-outline{background:white;border:1px solid var(--line);color:var(--ink)}
    .btn-danger{background:#fff2f2;color:#9d3f3f;border:1px solid #efd2d2}
    .btn-full{width:100%}
    .route-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
    .route{
      border:none;text-align:left;border-radius:20px;padding:20px;min-height:184px;
      color:var(--ink);position:relative;overflow:hidden;
    }
    .route strong{display:block;font-size:1.2rem;margin:8px 0 7px}
    .route span{display:block;color:#3f595d;line-height:1.5}
    .route-nature{background:linear-gradient(145deg,#e5f4ee,#c9e9df)}
    .route-community{background:linear-gradient(145deg,#fbecdc,#f1d5b8)}
    .route-icon{font-size:2rem}
    .route:after{
      content:"→";position:absolute;right:16px;bottom:12px;font-size:1.5rem;font-weight:900;opacity:.55
    }
    .status{
      display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin:6px 0 14px
    }
    .status-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:900}
    .score{font-size:1.28rem;font-weight:950}
    .progress{
      height:9px;background:#e7eeee;border-radius:99px;overflow:hidden;margin-top:7px
    }
    .progress > div{
      height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease
    }
    .space-type{
      display:inline-flex;padding:7px 10px;border-radius:999px;background:#edf4f3;
      text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;font-weight:950;color:#47666b;
      margin-bottom:12px
    }
    .checkpoint{background:#fff7e7;color:#8a611e;border:1px solid #f0d69c}
    .story-copy{
      white-space:pre-line;font-size:1.12rem;line-height:1.72;color:#26434a;
      font-weight:500;letter-spacing:.005em;
    }
    .choice-list{display:grid;gap:10px;margin-top:16px}
    .choice{
      width:100%;text-align:left;border:1px solid var(--line);background:#fff;
      padding:13px 14px;border-radius:14px;color:var(--ink);font-weight:800;
    }
    .choice:hover{border-color:#9ebbbb;background:#f8fbfb}
    .choice[disabled]{cursor:default;opacity:.9}
    .choice.correct{border-color:#78bca8;background:#eaf7f2}
    .choice.wrong{border-color:#d8a0a0;background:#fff0f0}
    .feedback{
      margin-top:14px;padding:14px;border-radius:14px;background:#f7f4ea;line-height:1.55
    }
    .impact-note{
      margin-top:16px;padding:13px 14px;border-radius:14px;
      background:#eef7f4;border:1px solid #d4e8e2;color:#365d58;font-weight:800;
    }
    .dice-panel{text-align:center;padding:26px 18px}
    .dice-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    .mode-card{
      border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;text-align:left
    }
    .mode-card strong{display:block;margin-bottom:6px}
    .d4-wrap{display:grid;place-items:center;margin:24px auto 8px}
    .d4{
      width:128px;height:112px;display:grid;place-items:center;color:#fff;font-weight:950;font-size:2.4rem;
      background:linear-gradient(160deg,#0f7180,#0a4a55);
      clip-path:polygon(50% 0%, 100% 100%, 0 100%);
      filter:drop-shadow(0 13px 13px rgba(10,50,56,.2));
      user-select:none;
    }
    .d4 span{transform:translateY(18px)}
    .d4.clickable{cursor:pointer}
    .rolling{animation:rollD4 .13s linear infinite}
    @keyframes rollD4{
      0%{transform:rotate(-7deg) scale(.98)}
      50%{transform:rotate(7deg) scale(1.05)}
      100%{transform:rotate(-7deg) scale(.98)}
    }
    .roll-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
    .roll-number{
      min-height:58px;border-radius:16px;border:1px solid var(--line);background:#fff;
      font-size:1.35rem;font-weight:950;color:var(--accent)
    }
    .checkpoint-alert{
      background:#fff5dc;border:1px solid #f0d192;color:#79551b;
      border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:850
    }
    .footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
    .link-btn{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:.86rem;padding:7px;font-weight:800}
    .final-badge{
      display:inline-flex;align-items:center;gap:8px;background:#eef5f3;border:1px solid var(--line);
      border-radius:999px;padding:10px 14px;font-weight:950;margin:10px 0 18px
    }
    .final-score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
    .metric{background:#f4f7f6;border-radius:18px;padding:16px}
    .metric b{display:block;font-size:1.6rem;margin-top:4px}

    /* Big point celebration */
    .point-pop{
      text-align:center;padding:34px 18px;position:relative;overflow:hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(212,154,58,.13), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(14,122,102,.10), transparent 28%),
        #fff;
    }
    .point-icon{font-size:3rem;animation:pointBounce .6s ease}
    .point-big{
      font-family:"Fredoka","Arial Rounded MT Bold",sans-serif;
      font-size:clamp(2.8rem,12vw,5.2rem);line-height:1;font-weight:700;
      color:var(--nature);margin:8px 0 4px;
      animation:pointBounce .6s ease;
    }
    .point-get{
      font-family:"Fredoka","Arial Rounded MT Bold",sans-serif;
      font-size:clamp(1.5rem,6vw,2.35rem);font-weight:700;letter-spacing:.02em;
      color:var(--accent);margin-bottom:10px;
    }
    .point-sub{color:var(--muted);font-weight:800}
    .spark{
      position:absolute;width:10px;height:10px;border-radius:50%;opacity:.7;
      animation:spark 1s ease-out forwards;
    }
    .s1{left:13%;top:25%;background:#d49a3a}
    .s2{left:24%;top:12%;background:#0e7a66}
    .s3{right:18%;top:18%;background:#b76b2b}
    .s4{right:29%;top:32%;background:#86b9aa}
    .s5{left:42%;top:7%;background:#d8bd72}
    @keyframes pointBounce{
      0%{transform:scale(.55);opacity:0}
      65%{transform:scale(1.12);opacity:1}
      100%{transform:scale(1)}
    }
    @keyframes spark{
      0%{transform:translateY(8px) scale(.2);opacity:0}
      30%{opacity:.85}
      100%{transform:translateY(-36px) scale(1);opacity:0}
    }

    .hidden{display:none!important}
    .fade{animation:fade .28s ease}
    @keyframes fade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
    @media (max-width:590px){
      .route-grid,.dice-mode-grid{grid-template-columns:1fr}
      .hero{padding:24px 18px}
      .card{padding:18px}
      .final-score{grid-template-columns:1fr}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">Club Med Sustainability Mission</div>
    <button class="mini-btn hidden" id="restartBtn" type="button">Restart Game</button>
  </div>
  <main id="screen" aria-live="polite"></main>
</div>

<script>
(() => {
  const STORAGE_KEY = "clubMedSustainabilityMissionV5";
  const BEST_SCORE_KEY = "clubMedSustainabilityMissionBestScoresV1";
  const THEORETICAL_MAX = 2600;

  const ROUTES = {
    nature: {
      name: "Nature Mission",
      icon: "🌊",
      badge: "Nature Guardian",
      introTitle: "Save the Island Before Hatching Night",
      intro: `A message arrives from the beach team.

Sea turtle eggs are expected to hatch soon. But plastic waste, bright lights and pressure on the coastline are putting the habitat at risk.

Your mission is not simply to “learn about nature.” You are responsible for helping this resort protect the living world around it before hatching night.`,
      spaces: [
        {type:"Story", title:"Morning on the Beach", points:50, body:`The beach looks beautiful from a distance.

Then you notice a plastic bottle near the waterline, followed by smaller pieces in the sand.

A resort can look clean and still affect the world beyond its paths. What happens after our waste leaves our hands?`},
        {type:"Real-world Mission", title:"Ask the Club Med Team!", points:150, body:`Your family has noticed plastic on the beach. Before deciding what should change, go and speak to someone who knows this resort.

Find a Club Med staff member and ask:

“What is one thing Club Med does here to reduce plastic waste or protect nature?”

Listen to their answer. It might be a refill system, reusable items, waste sorting, biodiversity protection — or something unique to this resort.

Come back when your family can share one thing you learned from the team member.`},
        {type:"Decision", title:"The Beach Bar Problem", maxPoints:200, choices:[
          {text:"Keep using single-use cups because they are faster.", points:0, correct:false},
          {text:"Increase reusable or refillable options while keeping service practical.", points:200, correct:true},
          {text:"Stop serving drinks at the beach bar.", points:0, correct:false}
        ], body:`The beach bar is busy. Staff can serve guests faster with disposable cups, but the waste adds up every day.

You are responsible for both guest experience and environmental impact. What do you do?`,
        feedback:"The strongest option reduces unnecessary single-use items without removing the guest experience."},
        {type:"Club Med Initiative", title:"Bye-Bye Plastics", points:50, body:`Your decision connects to a real Club Med sustainability initiative: Bye-Bye Plastics.

The idea is simple: one disposable item can look insignificant, but repeated across many guests and many days, the impact becomes much larger.

Reducing single-use plastic is therefore not about one cup — it is about changing a system.`},
        {type:"Checkpoint", title:"The Turtle", points:100, body:`Later that morning, the beach team calls you.

A small sea turtle has been found weak near the edge of the beach. Plastic fragments are nearby. The team contacts the appropriate wildlife specialists.

Until now, “plastic” may have felt like a waste-management topic.

Now there is a life on the other side of the problem.

Your mission has become personal.`},
        {type:"Family Discussion", title:"What Does a Turtle Need?", points:100, body:`Talk together for 30 seconds.

If a sea turtle is going to survive here, what does its habitat need?

Think beyond “clean water.” Consider darkness, quiet, safe nesting space, healthy ecosystems and human behaviour.

There is no single perfect sentence — the point is to see the habitat as a whole.`},
        {type:"Decision", title:"Hatching at Night", maxPoints:200, choices:[
          {text:"Add brighter lights so guests can see the turtles.", points:0, correct:false},
          {text:"Reduce unnecessary lighting and keep a respectful distance.", points:200, correct:true},
          {text:"Pick up the hatchlings and carry them to the sea.", points:0, correct:false}
        ], body:`The eggs may hatch at night. Guests are excited, but the beach is brightly lit.

What should the resort team do?`,
        feedback:"Protecting wildlife often means changing how people use a space, rather than trying to control the animals themselves."},
        {type:"Club Med Initiative", title:"Biodiversity Protection", points:50, body:`Sustainability is not only about carbon or waste.

It also means protecting habitats and the species that depend on them.

This is why biodiversity protection matters to a resort surrounded by beaches, forests, reefs or other sensitive ecosystems.`},
        {type:"Mini Mission", title:"Build a Safe Beach", points:150, body:`Imagine you are preparing the beach for hatching night.

Choose the features you would want to KEEP:
• a quiet protected zone
• a clear path to the sea
• reduced unnecessary lighting

And REMOVE:
• plastic waste
• loud activity next to the nest
• crowding around the nesting area

If your family agrees on the plan, complete the mission.`},
        {type:"Checkpoint", title:"The Storm", points:100, body:`That night, the weather changes.

Strong rain and waves hit the beach. By morning, the shoreline has changed and water has reached closer to the nesting area.

Now the problem is harder.

Guests still want a beautiful beach. Wildlife still needs protection.

Sustainability is no longer about choosing the “nice” option — it is about managing a real trade-off.`},
        {type:"Decision", title:"Move the Beach Event?", maxPoints:200, choices:[
          {text:"Run the event exactly as planned beside the protected area.", points:0, correct:false},
          {text:"Move the event and explain why the protected area needs space.", points:200, correct:true},
          {text:"Move the nest so the event can stay.", points:0, correct:false}
        ], body:`A popular family event is scheduled close to the protected part of the beach.

Changing it may disappoint some guests. Leaving it may increase disturbance.

What do you do?`,
        feedback:"A sustainable guest experience sometimes requires changing the experience itself, then explaining the reason clearly."},
        {type:"Story", title:"Under the Water", points:50, body:`The mission is bigger than one turtle.

Below the surface, coral, fish, water quality and the coastline form one connected system.

Remove one part, and the effects can move through the rest.

Nature is not a collection of separate attractions. It is a network.`},
        {type:"Mini Mission", title:"Cause & Effect", points:150, body:`As a family, connect each cause with the effect it could create:

Plastic waste → risk to marine life
Bright beach lights → disruption for hatchlings
Healthy habitat → stronger biodiversity
Less unnecessary waste → lower pressure on the environment

When everyone can explain one connection, complete the mission.`},
        {type:"Real-world Mission", title:"Find Sustainability in Action", points:150, body:`Explore the real resort.

Find one action that reduces environmental pressure — a sign, refill station, waste system, protected area, landscaping choice or another example.

The goal is to notice something you might have walked past before.`},
        {type:"Checkpoint", title:"One Night Left", points:100, body:`Tomorrow night, the remaining eggs are expected to hatch.

When you first arrived, you may have seen only blue water and white sand.

Now you know that beneath the sand are eggs, beyond the shore are ecosystems, and behind every guest experience are choices.

Tomorrow you will find out whether the beach is ready.`},
        {type:"Challenge", title:"Guests Want a Better View", maxPoints:200, choices:[
          {text:"Let everyone gather close so nobody misses the moment.", points:0, correct:false},
          {text:"Create a viewing boundary, explain the reason and keep the nesting path clear.", points:200, correct:true},
          {text:"Cancel all access to the beach without explanation.", points:0, correct:false}
        ], body:`Word spreads that the turtles may hatch tonight. More guests arrive and everyone wants the best view.

How do you protect the animals while keeping guests involved?`,
        feedback:"Good sustainability design often protects what matters while still giving people a meaningful way to participate."},
        {type:"Action", title:"Prepare the Beach", points:150, body:`Your team has one final preparation window.

Agree on three actions:
• reduce unnecessary lighting
• keep a safe viewing distance
• remove obstacles and litter

This is the moment where knowledge becomes action.`},
        {type:"Reflection", title:"Has Your View Changed?", points:100, body:`Look at the beach again.

At the beginning, what did you notice first?

Now what do you notice?

Talk together about one thing that changed in the way you see this place.`},
        {type:"Story", title:"They Begin to Move", points:50, body:`10:42 PM.

The sand begins to move.

One hatchling appears, then another. The route to the sea is clear. Guests watch quietly from farther back.

The beach is still a place for people — but tonight, people have made space for something else too.`},
        {type:"Achievement", title:"Nature Guardian", points:300, body:`The last hatchling reaches the water.

You did not “save nature” with one perfect action. You learned to notice what a resort's choices can affect — and to make better choices when interests compete.

Sometimes sustainability begins with something very small:

noticing that our convenience can become another living thing's problem.

NATURE MISSION COMPLETE.`}
      ]
    },

    community: {
      name: "Community Mission",
      icon: "🤝",
      badge: "Community Guardian",
      introTitle: "Can a Resort Grow Without Leaving Its Community Behind?",
      intro: `Breakfast is ready. The buffet is full, the resort is busy, and everything appears to be working.

But nearby, local farmers are trying to find reliable buyers. Some food travels long distances to reach the resort, while local produce can still go unsold.

Your mission is to help Club Med grow in a way that strengthens the people around it — not only the resort itself.`,
      spaces: [
        {type:"Story", title:"Your Breakfast Has a Story", points:50, body:`Look at a plate of food.

It did not begin in the restaurant.

Someone grew it. Someone transported it. Someone prepared it. Someone served it.

Your first task is to look past the buffet and notice the people behind it.`},
        {type:"Real-world Mission", title:"Pick One Food", points:150, body:`Choose one thing you ate today — fruit, vegetables, eggs, rice, bread or something else.

As a family, guess where it came from and how many people may have been involved before it reached your plate.

The goal is not to be perfectly correct. It is to see the supply chain.`},
        {type:"Decision", title:"The Cheapest Supplier", maxPoints:200, choices:[
          {text:"Always choose the lowest price, regardless of anything else.", points:0, correct:false},
          {text:"Consider price, quality, environmental impact and local value together.", points:200, correct:true},
          {text:"Buy locally in every situation, even if supply or quality cannot meet needs.", points:0, correct:false}
        ], body:`The purchasing team offers you a cheaper supplier from farther away.

The local option costs more, but may create value in the community.

How should a responsible resort make the decision?`,
        feedback:"Responsible purchasing is about balancing several impacts, not following one simple rule."},
        {type:"Club Med Initiative", title:"Green Farmers", points:50, body:`This connects to Green Farmers — one of the Club Med initiatives highlighted for this mission.

The bigger idea is partnership: tourism can create demand that helps local agriculture become more resilient and sustainable.

The farmer is not just a supplier. The relationship itself can create impact.`},
        {type:"Checkpoint", title:"Meet the Farmer", points:100, body:`That afternoon, you meet a farmer who supplies food locally.

They tell you:

“I can grow good produce. But if I do not know who will buy it next season, it is difficult to plan, invest or support my family.”

To the resort, this can look like a supplier problem.

To the farmer, it is a livelihood.

Your mission has become personal.`},
        {type:"Family Discussion", title:"What Is Fair?", points:100, body:`Talk together for 30 seconds.

What makes a business relationship “fair”?

The lowest price?
The highest price?
A reliable long-term partnership?
Support when conditions change?

There is no one-word answer. Explain your reasoning to each other.`},
        {type:"Challenge", title:"The Resort Is Full", maxPoints:200, choices:[
          {text:"Drop the local supplier immediately and switch completely.", points:0, correct:false},
          {text:"Use a balanced supply plan while keeping the local partnership where possible.", points:200, correct:true},
          {text:"Let the restaurant run short rather than use any additional supplier.", points:0, correct:false}
        ], body:`Bookings suddenly rise. Tomorrow, the kitchen needs much more food than the local farm can supply.

You must keep guests fed without treating the local relationship as disposable.

What do you do?`,
        feedback:"Sustainability has to work under pressure. Resilience often comes from balancing supply while protecting long-term partnerships."},
        {type:"Discovery", title:"People Behind Club Med", points:50, body:`A resort is not only rooms and facilities.

Kitchen teams, housekeeping, sports staff, maintenance, reception and many others shape the guest experience every day.

A sustainable business also asks whether the people around it can build skills, opportunities and stable livelihoods.`},
        {type:"Real-world Mission", title:"Notice Someone", points:150, body:`Think of one person who helped make your stay better today.

If appropriate, thank them.

This mission is deliberately simple: sustainability becomes more human when we notice the people who normally remain in the background.`},
        {type:"Checkpoint", title:"Food in the Bin", points:100, body:`After dinner, you see food waste from the buffet.

Among it are vegetables similar to the ones grown by the farmer you met.

Water, land, transport, work and time went into producing that food.

Food waste is no longer just a number.

Now you know there is a person at the beginning of the story.`},
        {type:"Decision", title:"Too Much Food Waste", maxPoints:200, choices:[
          {text:"Measure what is being wasted and where, then target the biggest causes.", points:200, correct:true},
          {text:"Immediately cut the entire menu in half without checking the causes.", points:0, correct:false},
          {text:"Ignore it because buffet waste is unavoidable.", points:0, correct:false}
        ], body:`The kitchen wants to reduce waste, but nobody is sure which foods, meals or behaviours are causing the biggest problem.

What should the team do first?`,
        feedback:"Measuring the problem helps the resort act on evidence instead of guessing."},
        {type:"Real-world Action", title:"Take What You Can Finish", points:150, body:`At your next meal, try one practical action:

Take only what you think you can finish. If you are still hungry, you can always go back.

A system matters — but guest behaviour is part of that system too.`},
        {type:"Discovery", title:"Responsible Purchasing", points:50, body:`A cheap product is not automatically the best-value product.

Responsible purchasing can consider quality, reliability, environmental impact and the effect on people.

Sustainability becomes a business decision, not an extra activity on the side.`},
        {type:"Challenge", title:"A Bad Harvest", maxPoints:200, choices:[
          {text:"End the partnership immediately because the farm missed its normal volume.", points:0, correct:false},
          {text:"Work on a temporary supply solution while discussing how the partnership can continue.", points:200, correct:true},
          {text:"Ignore the shortage and hope it fixes itself.", points:0, correct:false}
        ], body:`A difficult season reduces the farmer's harvest.

Someone on the team says: “If they cannot deliver the usual amount, we should replace them.”

What would a long-term partnership look like now?`,
        feedback:"Long-term sustainability is tested when conditions are difficult, not only when everything is easy."},
        {type:"Checkpoint", title:"The Contract", points:100, body:`You sit down with the farmer again.

Today you are not only deciding the price of vegetables.

You are deciding whether the resort wants a relationship that exists only when it is convenient — or a partnership that can create value over time.

You are not simply choosing a supplier.

You are choosing what kind of neighbour Club Med wants to be.`},
        {type:"Decision", title:"Invest in People", maxPoints:200, choices:[
          {text:"Avoid training because it costs time and money.", points:0, correct:false},
          {text:"Invest in training when it can build capability and opportunity over time.", points:200, correct:true},
          {text:"Only recruit people who already have every skill required.", points:0, correct:false}
        ], body:`A local team member wants to take on more responsibility, but training will require time and budget.

What does long-term value look like?`,
        feedback:"Developing people can strengthen both the guest experience and the community around the resort."},
        {type:"Reflection", title:"Who Makes Your Holiday Possible?", points:100, body:`Imagine the resort building is still here — but remove the farmers, cooks, cleaners, reception staff, activity teams and local partners.

Would the Club Med experience still exist?

Talk together about the people you usually do not see when you think about “sustainability.”`},
        {type:"Story", title:"Tonight's Dinner", points:50, body:`At dinner, one dish is marked as using locally sourced ingredients.

You recognise the type of produce from the farm in your mission.

The journey is now visible:

farm → partnership → kitchen → family table.

A business relationship has become part of the guest experience.`},
        {type:"Reflection", title:"Does Sustainability Also Mean People?", points:100, body:`When the mission started, what did the word “sustainability” make you picture?

Trees? Oceans? Plastic? Carbon?

Now ask the question again.

Can sustainability also mean livelihoods, opportunity, dignity and relationships?`},
        {type:"Achievement", title:"Community Guardian", points:300, body:`Months later, the local partnership continues.

The kitchen has improved how it manages food. Team members are developing new skills. The farmer has a more reliable relationship with the resort.

The resort did not grow above the community.

It grew with it.

COMMUNITY MISSION COMPLETE.`}
      ]
    }
  };

  const state = {
    screen:"welcome",
    route:null,
    pos:0,
    score:0,
    possible:0,
    diceMode:null,
    currentSpaceScored:false,
    lastRoll:null,
    checkpointHit:false,
    history:[]
  };

  const screen = document.getElementById("screen");
  const restartBtn = document.getElementById("restartBtn");

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function restore(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const saved = JSON.parse(raw);
      if(saved && saved.route && ["nature","community"].includes(saved.route)){
        Object.assign(state, saved);
        if(!Array.isArray(state.history)) state.history = [];
        return true;
      }
    }catch(e){}
    return false;
  }
  function clearSave(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
  }
  function setScreen(html){
    screen.innerHTML = `<div class="fade">${html}</div>`;
    restartBtn.classList.toggle("hidden", state.screen === "welcome");
    try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }
  }
  function resetAll(){
    clearSave();
    state.screen="welcome";
    state.route=null;
    state.pos=0;
    state.score=0;
    state.possible=0;
    state.diceMode=null;
    state.currentSpaceScored=false;
    state.lastRoll=null;
    state.checkpointHit=false;
    state.history=[];
    renderWelcome();
  }
  restartBtn.addEventListener("click", resetAll);

  function renderWelcome(){
    state.screen="welcome";
    setScreen(`
      <section class="hero">
        <div class="eyebrow">🌍 A family sustainability adventure</div>
        <h1>Your holiday has a hidden mission.</h1>
        <p class="lead">The resort looks perfect. But behind the beaches, buffets and guest experiences are choices that affect nature and people.</p>
        <div class="quote">Today, your family becomes the Sustainability Mission Team.</div>
        <p>Choose a mission, roll a 4-sided dice, make decisions, discover real Club Med sustainability initiatives and see where your choices lead.</p>
        <div class="actions">
          <button class="btn btn-primary" id="beginBtn" type="button">Begin the mission</button>
        </div>
      </section>
    `);
    document.getElementById("beginBtn").addEventListener("click", renderRouteChoice);
  }

  function renderRouteChoice(){
    state.screen="route";
    setScreen(`
      <section class="card">
        <div class="eyebrow">Mission briefing</div>
        <h2>Two problems. One choice.</h2>
        <p>Nature and communities both matter — but your family will experience one story this time.</p>
        <div class="route-grid">
          <button class="route route-nature" data-route="nature" type="button">
            <div class="route-icon">🌊</div>
            <strong>Protect Nature</strong>
            <span>Help protect the beach, biodiversity and sea turtles before hatching night.</span>
          </button>
          <button class="route route-community" data-route="community" type="button">
            <div class="route-icon">🤝</div>
            <strong>Support Community</strong>
            <span>Help the resort grow without leaving local farmers and people behind.</span>
          </button>
        </div>
      </section>
    `);
    document.querySelectorAll("[data-route]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.route=btn.dataset.route;
        state.pos=0;
        state.score=0;
        state.possible=0;
        state.diceMode=null;
        state.currentSpaceScored=false;
        state.lastRoll=null;
        state.checkpointHit=false;
        state.history=[];
        save();
        renderRouteIntro();
      });
    });
  }

  function renderRouteIntro(){
    const r=ROUTES[state.route];
    state.screen="intro";
    setScreen(`
      <section class="hero">
        <div class="eyebrow">${r.icon} ${esc(r.name)}</div>
        <h2>${esc(r.introTitle)}</h2>
        <p class="story-copy">${esc(r.intro)}</p>
        <div class="impact-note">
          <strong>Score big:</strong> correct decisions earn 200 points, real-world missions earn 150, and the final achievement is worth 300. Wrong quiz answers earn 0 — so every choice matters.
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="continueIntro" type="button">Accept mission</button>
        </div>
      </section>
    `);
    document.getElementById("continueIntro").addEventListener("click", renderDiceModeChoice);
  }

  function renderDiceModeChoice(){
    state.screen="diceChoice";
    setScreen(`
      <section class="card">
        <div class="eyebrow">🎲 Choose your dice</div>
        <h2>How would you like to roll?</h2>
        <p>You can use the physical 4-sided dice from the game kit, or let the website roll for you.</p>
        <div class="dice-mode-grid">
          <button class="mode-card" data-mode="physical" type="button">
            <strong>🎲 I have a physical dice</strong>
            <span>Roll it, then tap 1–4 on this page.</span>
          </button>
          <button class="mode-card" data-mode="digital" type="button">
            <strong>📱 Roll digitally</strong>
            <span>Tap the digital D4 and watch it roll for one second.</span>
          </button>
        </div>
      </section>
    `);
    document.querySelectorAll("[data-mode]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.diceMode=btn.dataset.mode;
        save();
        renderRoll();
      });
    });
  }

  function statusMarkup(){
    const r=ROUTES[state.route];
    const pct=Math.min(100,(state.pos/20)*100);
    return `
      <div class="status">
        <div>
          <div class="status-label">${r.icon} ${esc(r.name)} · Space ${state.pos}/20</div>
          <div class="progress"><div style="width:${pct}%"></div></div>
        </div>
        <div style="text-align:right">
          <div class="status-label">Green Score</div>
          <div class="score">🌱 ${state.score}</div>
        </div>
      </div>
    `;
  }

  function undoButtonMarkup(){
    return state.history.length
      ? `<button class="btn btn-outline" id="undoMove" type="button">↩ Back to previous space</button>`
      : "";
  }

  function attachUndoButton(){
    const btn=document.getElementById("undoMove");
    if(!btn) return;
    btn.addEventListener("click", undoLastMove);
  }

  function renderRoll(message=""){
    if(state.pos>=20){ renderFinal(); return; }
    state.screen="roll";
    const physical=state.diceMode==="physical";
    setScreen(`
      ${statusMarkup()}
      <section class="card dice-panel">
        <div class="eyebrow">Your turn</div>
        <h2>${physical ? "Roll your physical D4" : "Tap the digital D4"}</h2>
        ${message ? `<div class="checkpoint-alert">${esc(message)}</div>` : ""}
        ${physical ? `
          <p>Roll the 4-sided dice, then enter the result.</p>
          <div class="roll-buttons">
            <button class="roll-number" data-roll="1" type="button">1</button>
            <button class="roll-number" data-roll="2" type="button">2</button>
            <button class="roll-number" data-roll="3" type="button">3</button>
            <button class="roll-number" data-roll="4" type="button">4</button>
          </div>
        ` : `
          <p>Tap once. The dice will roll for about one second.</p>
          <div class="d4-wrap">
            <div class="d4 clickable" id="digitalD4" role="button" tabindex="0" aria-label="Roll digital 4-sided dice"><span>?</span></div>
          </div>
          <strong id="rollText">TAP TO ROLL</strong>
        `}
        <div class="footer-actions">
          ${undoButtonMarkup()}
          <button class="btn btn-secondary" id="switchDice" type="button">Switch dice method</button>
        </div>
      </section>
    `);

    document.getElementById("switchDice").addEventListener("click", renderDiceModeChoice);
    attachUndoButton();

    if(physical){
      document.querySelectorAll("[data-roll]").forEach(b=>{
        b.addEventListener("click", ()=>moveByRoll(Number(b.dataset.roll)));
      });
    }else{
      const die=document.getElementById("digitalD4");
      const text=document.getElementById("rollText");
      let busy=false;
      const roll=()=>{
        if(busy) return;
        busy=true;
        die.classList.add("rolling");
        text.textContent="ROLLING...";
        const timer=setInterval(()=>{
          die.querySelector("span").textContent=1+Math.floor(Math.random()*4);
        },90);
        setTimeout(()=>{
          clearInterval(timer);
          const result=1+Math.floor(Math.random()*4);
          die.querySelector("span").textContent=result;
          die.classList.remove("rolling");
          text.textContent=`YOU ROLLED ${result}!`;
          setTimeout(()=>moveByRoll(result),650);
        },1000);
      };
      die.addEventListener("click",roll);
      die.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){
          e.preventDefault();
          roll();
        }
      });
    }
  }

  function moveByRoll(roll){
    /* Save the exact state BEFORE the roll.
       Undo returns to this snapshot, not merely one numbered space back. */
    state.history.push({
      pos:state.pos,
      score:state.score,
      possible:state.possible,
      currentSpaceScored:state.currentSpaceScored,
      lastRoll:state.lastRoll,
      checkpointHit:state.checkpointHit
    });

    state.lastRoll=roll;
    const old=state.pos;
    const target=Math.min(20,old+roll);
    const checkpoints=[5,10,15,20];
    let destination=target;
    let hit=false;

    for(const cp of checkpoints){
      if(cp>old && cp<=target){
        destination=cp;
        hit=true;
        break;
      }
    }

    state.pos=destination;
    state.checkpointHit=hit && destination!==target;
    state.currentSpaceScored=false;
    save();
    renderSpace();
  }

  function undoLastMove(){
    if(!state.history.length) return;
    const previous=state.history.pop();

    state.pos=previous.pos;
    state.score=previous.score;
    state.possible=previous.possible;
    state.currentSpaceScored=previous.currentSpaceScored;
    state.lastRoll=previous.lastRoll;
    state.checkpointHit=previous.checkpointHit || false;
    save();

    // If the previous position was the route start, show the mission start instead
    // of jumping straight back to the dice.
    if(state.pos===0){
      renderRouteStartReturn();
      return;
    }

    // Return to the actual square the player was on before rolling.
    renderPreviousSpace();
  }

  function renderRouteStartReturn(){
    const r=ROUTES[state.route];
    state.screen="previousStart";
    setScreen(`
      <section class="hero">
        <div class="eyebrow">${r.icon} Back at mission start</div>
        <h2>${esc(r.introTitle)}</h2>
        <p class="story-copy">${esc(r.intro)}</p>
        <div class="checkpoint-alert">↩ You returned to the position you were at before your last roll.</div>
        <div class="actions">
          <button class="btn btn-primary" id="rollAgainFromStart" type="button">Roll again</button>
        </div>
      </section>
    `);
    document.getElementById("rollAgainFromStart").addEventListener("click",()=>renderRoll());
  }

  function renderPreviousSpace(){
    const s=ROUTES[state.route].spaces[state.pos-1];
    const isCheckpoint=[5,10,15,20].includes(state.pos);
    state.screen="previousSpace";

    setScreen(`
      ${statusMarkup()}
      <section class="card">
        <div class="checkpoint-alert">↩ Back to the space you were on before your last roll.</div>
        <div class="space-type ${isCheckpoint ? "checkpoint" : ""}">
          ${isCheckpoint ? "🛑 " : ""}${esc(s.type)} · Space ${state.pos}
        </div>
        <h2>${esc(s.title)}</h2>
        <p class="story-copy">${esc(s.body)}</p>

        <div class="impact-note">
          This space was already completed, so your previous Green Score points are kept.
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="returnToRoll" type="button">Roll from this space</button>
        </div>
      </section>
    `);

    document.getElementById("returnToRoll").addEventListener("click",()=>renderRoll());
  }

  function award(points,maxPoints=points){
    if(state.currentSpaceScored) return false;
    state.score+=points;
    state.possible+=maxPoints;
    state.currentSpaceScored=true;
    save();
    return true;
  }

  function showPointCelebration(points,nextAction,subtitle="Green Score earned"){
    state.screen="points";
    setScreen(`
      ${statusMarkup()}
      <section class="card point-pop">
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <div class="point-icon">🌱</div>
        <div class="point-big">+${points}</div>
        <div class="point-get">${points === 1 ? "POINT GET!" : "POINTS GET!"}</div>
        <div class="point-sub">${esc(subtitle)}</div>
        <div class="actions" style="justify-content:center">
          <button class="btn btn-primary" id="continueAfterPoints" type="button">Continue</button>
        </div>
        <div class="footer-actions">
          ${undoButtonMarkup()}
        </div>
      </section>
    `);
    document.getElementById("continueAfterPoints").addEventListener("click",nextAction);
    attachUndoButton();
  }

  function renderSpace(){
    const r=ROUTES[state.route];
    const s=r.spaces[state.pos-1];
    state.screen="space";
    const isCheckpoint=[5,10,15,20].includes(state.pos);

    setScreen(`
      ${statusMarkup()}
      ${state.checkpointHit ? `<div class="checkpoint-alert">🛑 Your roll would have passed an important story moment, so the mission stopped you at Checkpoint ${state.pos}.</div>` : ""}
      <section class="card">
        <div class="space-type ${isCheckpoint ? "checkpoint" : ""}">${isCheckpoint ? "🛑 " : ""}${esc(s.type)} · Space ${state.pos}</div>
        <h2>${esc(s.title)}</h2>
        <p class="story-copy">${esc(s.body)}</p>

        ${s.choices ? `
          <div class="choice-list" id="choices">
            ${s.choices.map((c,i)=>`<button class="choice" data-choice="${i}" type="button">${String.fromCharCode(65+i)}. ${esc(c.text)}</button>`).join("")}
          </div>
          <div id="feedback"></div>
        ` : `
          <div class="actions">
            <button class="btn btn-primary" id="completeSpace" type="button">${state.pos===20 ? "Finish this mission" : "Complete task"}</button>
          </div>
        `}

        <div class="footer-actions">
          ${undoButtonMarkup()}
        </div>
      </section>
    `);

    attachUndoButton();

    if(s.choices){
      document.querySelectorAll("[data-choice]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(state.currentSpaceScored) return;
          const idx=Number(btn.dataset.choice);
          const choice=s.choices[idx];

          award(choice.points,s.maxPoints||200);

          document.querySelectorAll("[data-choice]").forEach((b,i)=>{
            b.disabled=true;
            const item=s.choices[i];
            if(item.correct) b.classList.add("correct");
            else if(i===idx) b.classList.add("wrong");
          });

          document.getElementById("feedback").innerHTML=`
            <div class="feedback">
              <strong>${choice.correct ? "Great decision!" : "Not quite — this answer earns 0 points."}</strong><br>
              ${esc(s.feedback||"")}
              <div class="actions">
                <button class="btn btn-primary" id="showPoints" type="button">See your impact</button>
              </div>
            </div>
          `;

          document.getElementById("showPoints").addEventListener("click",()=>{
            showPointCelebration(
              choice.points,
              ()=> state.pos>=20 ? renderFinal() : renderRoll(),
              choice.correct ? "Great choice — big score bonus!" : "No score this time — use what you learned on the next challenge!"
            );
          });
        });
      });
    }else{
      document.getElementById("completeSpace").addEventListener("click",()=>{
        if(award(s.points||0,s.points||0)){
          showPointCelebration(
            s.points||0,
            ()=> state.pos>=20 ? renderFinal() : renderRoll(),
            s.type==="Achievement" ? "Mission achievement unlocked!" : "Your Green Score just increased!"
          );
        }
      });
    }
  }


  function loadBestScores(){
    try{
      const raw=localStorage.getItem(BEST_SCORE_KEY);
      const parsed=raw ? JSON.parse(raw) : {};
      return {
        nature:Number(parsed.nature)||0,
        community:Number(parsed.community)||0
      };
    }catch(e){
      return {nature:0,community:0};
    }
  }

  function saveBestScore(route,score){
    const best=loadBestScores();
    const previous=best[route]||0;
    if(score>previous){
      best[route]=score;
      try{ localStorage.setItem(BEST_SCORE_KEY,JSON.stringify(best)); }catch(e){}
      return {best:score,isNew:true,previous};
    }
    return {best:previous,isNew:false,previous};
  }

  function impactRate(){
    if(state.possible<=0) return 100;
    return Math.round((state.score/state.possible)*100);
  }
  function rank(score){
    if(score>=1500) return "Sustainability Champion";
    if(score>=1250) return "Green Guardian";
    if(score>=1000) return "Green Changemaker";
    return "Green Explorer";
  }

  function renderFinal(){
    const r=ROUTES[state.route];
    const title=rank(state.score);
    const bestResult=saveBestScore(state.route,state.score);
    state.screen="final";
    save();

    const routeReflection=state.route==="nature"
      ? `You protected wildlife and learned that a beautiful beach is also a habitat. But nature can only stay protected when people keep choosing to protect it.`
      : `You strengthened the link between the resort and the people around it. But communities also depend on healthy land, water and ecosystems.`;

    setScreen(`
      <section class="hero">
        <div class="eyebrow">🌍 Final goal · The two paths meet</div>
        <h1>Your mission ends here.<br>Your impact doesn't.</h1>
        <p class="lead">${esc(routeReflection)}</p>
        <div class="quote">Nature and people were never two separate missions. Sustainability is the connection between people, nature and the choices we make.</div>

        ${bestResult.isNew ? `<div class="checkpoint-alert">🏆 NEW HIGH SCORE!</div>` : ""}

        <div class="final-score">
          <div class="metric"><span class="status-label">Final Green Score</span><b>🌱 ${state.score}</b></div>
          <div class="metric"><span class="status-label">Best score on this device</span><b>🏆 ${bestResult.best}</b></div>
        </div>

        <div class="final-badge">🏅 ${esc(r.badge)}</div>
        <h3>${esc(title)}</h3>
        <p>The theoretical maximum is <strong>${THEORETICAL_MAX} points</strong>. Different dice rolls create different journeys, so families can replay the mission and try to beat their high score.</p>

        <div class="actions">
          <button class="btn btn-primary" id="playAgain" type="button">Try the other mission</button>
          ${undoButtonMarkup()}
        </div>
      </section>
    `);

    attachUndoButton();

    document.getElementById("playAgain").addEventListener("click",()=>{
      const other=state.route==="nature" ? "community" : "nature";
      state.route=other;
      state.pos=0;
      state.score=0;
      state.possible=0;
      state.currentSpaceScored=false;
      state.lastRoll=null;
      state.checkpointHit=false;
      state.history=[];
      save();
      renderRouteIntro();
    });
  }

  const resumed=restore();
  if(resumed){
    if(state.pos>=20 && state.screen!=="previousSpace") renderFinal();
    else if(state.screen==="previousSpace" && state.pos>0) renderPreviousSpace();
    else if(state.screen==="previousStart") renderRouteStartReturn();
    else if(state.screen==="space" && state.pos>0) renderSpace();
    else if(state.route) renderRoll("Welcome back — your progress was saved on this device.");
    else renderWelcome();
  }else{
    renderWelcome();
  }
})();
</script>
</body>
</html>
